services:
  nginx:
    image: nginx
    container_name: nginx
    ports:
      - "8000:80"
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  redis:
    image: redis
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  gateway:
    build: ./backend/gateway
    container_name: gateway
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/gateway/.env
    volumes:
      - ./backend/gateway:/app
      - ./shared:/shared:ro
      - /app/node_modules
    depends_on:
      - auth-service
      - agent-service
      - worker-service

  auth-service:
    build: ./backend/services/auth-service
    container_name: auth-service
    restart: always
    ports:
      - "4001:4001"
      - "4101:4101"
    env_file:
      - ./backend/services/auth-service/.env
    volumes:
      - ./backend/services/auth-service:/app
      - ./shared:/shared:ro
      - /app/node_modules
    depends_on:
      - redis
      - postgres

  agent-service:
    build: ./backend/services/agent-service
    container_name: agent-service
    restart: always
    ports:
      - "4002:4002"
      - "4102:4102"
    env_file:
      - ./backend/services/agent-service/.env
    volumes:
      - ./backend/services/agent-service:/app
      - ./prompt:/app/prompt:ro
      - ./shared:/shared:ro
      - /app/node_modules
    depends_on:
      - redis
      - postgres
      - qdrant

  worker-service:
    build: ./backend/services/worker-service
    container_name: worker-service
    restart: always
    ports:
      - "4003:4003"
      - "4103:4103"
    env_file:
      - ./backend/services/worker-service/.env
    volumes:
      - ./backend/services/worker-service:/app
      - ./shared:/shared:ro
      - /app/node_modules
    depends_on:
      - redis
      - postgres
      - qdrant

volumes:
  postgres_data:
  qdrant_data:
