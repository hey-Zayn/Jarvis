<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jarvis - Enable Microphone</title>
  <style>
    body {
      background: #09090b; color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
    }
    .card {
      background: #18181b; border: 1px solid #27272a; border-radius: 16px;
      padding: 36px 32px; text-align: center; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .icon {
      width: 56px; height: 56px; background: #7c3aed; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 13px; color: #a1a1aa; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #7c3aed; color: white; border: none; border-radius: 8px;
      padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s;
    }
    button:hover { background: #6d28d9; }
    .status { margin-top: 14px; font-size: 12px; color: #10b981; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </div>
    <h1>Microphone Access</h1>
    <p>Chrome requires granting microphone permission once in a tab. Click below and select <strong>"Allow"</strong>.</p>
    <button id="btnAllow">Enable Microphone</button>
    <div class="status" id="statusMsg"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
